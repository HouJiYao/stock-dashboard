<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>台股產業龍頭終端</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#04060c;--ink:#e6edf7;--mute:#7d8aa5;--line:rgba(120,160,255,.16);--cy:#22d3ee;--vi:#8b5cf6;--up:#ff4d6d;--down:#19e6a1;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.7 "Noto Sans TC",system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;background-image:linear-gradient(rgba(120,160,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(120,160,255,.06) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 20%,#000 30%,transparent 75%);animation:pan 24s linear infinite}
body::after{content:"";position:fixed;inset:0;z-index:5;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
@keyframes pan{to{background-position:0 44px,44px 0}}
.orb{position:fixed;z-index:-1;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.28;pointer-events:none}
.o1{background:var(--cy);top:-18vmax;left:-12vmax;animation:drift 22s ease-in-out infinite alternate}
.o2{background:var(--vi);bottom:-20vmax;right:-14vmax;animation:drift 28s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.tape{overflow:hidden;white-space:nowrap;border-bottom:1px solid var(--line);background:rgba(8,12,24,.65);font:12.5px "JetBrains Mono",monospace}
.track{display:inline-block;padding:8px 0;animation:marq 70s linear infinite;will-change:transform}
.tape:hover .track{animation-play-state:paused}
.track span{margin-right:38px}
@keyframes marq{to{transform:translateX(-50%)}}
header,nav,main,.banner{max-width:1100px;margin-inline:auto;padding-inline:20px}
header{padding-top:30px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
.eyebrow{font:500 12px "JetBrains Mono",monospace;letter-spacing:.22em;color:var(--cy);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--down);box-shadow:0 0 0 0 rgba(25,230,161,.7);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px rgba(25,230,161,0)}100%{box-shadow:0 0 0 0 rgba(25,230,161,0)}}
h1{margin:4px 0 0;font:700 clamp(28px,5vw,40px)/1.15 "Chakra Petch","Noto Sans TC",sans-serif;letter-spacing:.08em;background:linear-gradient(90deg,#fff,var(--cy) 60%,var(--vi));-webkit-background-clip:text;background-clip:text;color:transparent}
.meta{text-align:right;font:12.5px "JetBrains Mono",monospace;color:var(--mute)}
#clock{font-size:20px;color:var(--ink);letter-spacing:.08em}
.banner{margin-top:10px;color:var(--mute);font-size:12.5px}
nav{display:flex;gap:8px;overflow-x:auto;padding-block:18px 6px}
.tab{background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--mute);padding:7px 16px;border-radius:8px;font:inherit;cursor:pointer;white-space:nowrap;letter-spacing:.06em;transition:.2s}
.tab:hover{color:var(--ink);border-color:rgba(34,211,238,.5)}
.tab[aria-pressed=true]{color:#04101a;font-weight:700;background:linear-gradient(90deg,var(--cy),#60a5fa);border-color:transparent;box-shadow:0 0 18px rgba(34,211,238,.35)}
.tab:focus-visible,.card:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;padding-block:14px 60px}
.card{position:relative;text-align:left;color:inherit;font:inherit;padding:18px 18px 12px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(18,26,48,.78),rgba(8,12,24,.78));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);cursor:pointer;overflow:hidden;transition:border-color .25s,transform .25s,box-shadow .25s}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(240px circle at var(--mx,50%) var(--my,0),rgba(34,211,238,.17),transparent 60%);opacity:0;transition:opacity .25s;pointer-events:none}
.card::after{content:"";position:absolute;top:8px;right:8px;width:10px;height:10px;border-top:1px solid var(--cy);border-right:1px solid var(--cy);opacity:.7}
.card:hover::before{opacity:1}
.card:hover{border-color:rgba(34,211,238,.55);transform:translateY(-3px)}
.card.on{border-color:var(--cy);box-shadow:0 0 0 1px var(--cy),0 0 30px rgba(34,211,238,.25)}
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.top{display:flex;justify-content:space-between;align-items:baseline;padding-right:14px}
.top b{font-weight:700;font-size:16px;letter-spacing:.05em}
.sym{color:var(--mute);font:12px "JetBrains Mono",monospace}
.price{font:500 30px/1.3 "JetBrains Mono",monospace;margin-top:8px;border-radius:6px;display:inline-block}
.chg{font:14px "JetBrains Mono",monospace}
.up{color:var(--up)}.down{color:var(--down)}
.price.up{text-shadow:0 0 18px rgba(255,77,109,.45)}.price.down{text-shadow:0 0 18px rgba(25,230,161,.4)}
.fu{animation:fu 1s}.fd{animation:fd 1s}
@keyframes fu{0%{background:rgba(255,77,109,.4)}100%{background:transparent}}
@keyframes fd{0%{background:rgba(25,230,161,.35)}100%{background:transparent}}
.spark{height:60px;margin-top:8px}
svg{width:100%;height:100%;display:block}
.draw{stroke-dasharray:1;animation:draw 1.2s ease-out backwards}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.fade{animation:fadein 1s .4s backwards}
@keyframes fadein{from{opacity:0}}
#panel{grid-column:1/-1;position:relative;padding:26px;border-radius:16px;border:1px solid rgba(34,211,238,.4);background:linear-gradient(160deg,rgba(14,22,42,.85),rgba(6,10,20,.85));-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 0 40px rgba(34,211,238,.1)}
.ph{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
#panel h2{margin:0;font:700 24px "Chakra Petch","Noto Sans TC",sans-serif;letter-spacing:.06em}
.chartbox{height:260px;margin-top:14px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:18px 0}
.kv div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.02)}
.kv span{display:block;color:var(--mute);font-size:12px}
.kv b{font:500 18px "JetBrains Mono",monospace}
.ai{border-left:2px solid var(--vi);padding:2px 0 2px 14px;margin-top:6px;white-space:pre-wrap;max-width:48em}
.caret::after{content:"▍";color:var(--cy);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
h3{margin:22px 0 4px;font:500 12px "JetBrains Mono",monospace;letter-spacing:.2em;color:var(--cy)}
.news{list-style:none;padding:0;margin:0}
.news li{padding:9px 0;border-top:1px solid var(--line);transition:padding-left .2s}
.news li:hover{padding-left:8px}
.news a{color:var(--ink);text-decoration:none}.news a:hover{color:var(--cy)}
.news small{color:var(--mute)}
.note{color:var(--mute);font-size:12.5px;margin:18px 0 0}
.empty{color:var(--mute);padding:60px 0;text-align:center;grid-column:1/-1}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div>
<div class="tape"><div class="track" id="track"></div></div>
<header>
  <div><div class="eyebrow"><i class="dot"></i>LIVE MARKET TERMINAL</div><h1>產業龍頭終端</h1></div>
  <div class="meta"><div id="clock"></div><div id="stamp"></div></div>
</header>
<!--BANNER-->
<nav id="tabs" aria-label="產業"></nav>
<main id="grid"></main>
<script>
const getData=()=>fetch("/data.json?t="+Date.now()).then(r=>r.json());//@GETDATA
const UP="#ff4d6d",DOWN="#19e6a1",reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let D=null,sector=0,pick=null,charts=[],last={},typer=null;
const fmt=n=>n==null?"–":Number(n).toLocaleString("en-US",{maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const big=n=>n==null?"–":n>=1e12?(n/1e12).toFixed(2)+" 兆":n>=1e8?(n/1e8).toFixed(0)+" 億":fmt(n);
const $=s=>document.querySelector(s);
setInterval(()=>$("#clock").textContent=new Date().toLocaleTimeString("zh-TW",{hour12:false}),1000);

async function load(first){
  try{D=await getData();render(first);ticker();}
  catch(e){$("#grid").innerHTML='<p class="empty">資料載入中或暫時無法取得，請稍後重新整理。</p>';}
}
function count(el,to){
  if(reduce||!isFinite(to)){el.textContent=fmt(to);return}
  const t0=performance.now(),o={minimumFractionDigits:2,maximumFractionDigits:2};
  (function f(t){const k=Math.min((t-t0)/700,1);el.textContent=(to*(1-Math.pow(1-k,3))).toLocaleString("en-US",o);if(k<1)requestAnimationFrame(f)})(t0);
}
function spark(p,up,anim){
  if(p.length<2)p=[p[0],p[0]];
  const mn=Math.min(...p),mx=Math.max(...p),w=300,h=60,dx=w/(p.length-1),c=up?UP:DOWN,id="g"+Math.random().toString(36).slice(2,7);
  const pts=p.map((v,i)=>`${(i*dx).toFixed(1)},${(h-5-(v-mn)/(mx-mn||1)*(h-10)).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".35"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs><polygon class="${anim?"fade":""}" points="0,${h} ${pts} ${w},${h}" fill="url(#${id})"/><polyline class="${anim?"draw":""}" pathLength="1" points="${pts}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"/></svg>`;
}
function bigChart(box,series,up){
  const cv=document.createElement("canvas");box.append(cv);const c=up?UP:DOWN;
  charts.push(new Chart(cv,{type:"line",
    data:{labels:series.map(x=>new Date(x.t).toLocaleString("zh-TW",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})),
      datasets:[{data:series.map(x=>x.p),borderColor:c,borderWidth:2,pointRadius:0,pointHoverRadius:5,tension:.3,fill:true,
        backgroundColor:ctx=>{const a=ctx.chart.chartArea;if(!a)return c+"22";const g=ctx.chart.ctx.createLinearGradient(0,a.top,0,a.bottom);g.addColorStop(0,c+"55");g.addColorStop(1,c+"00");return g}}]},
    options:{maintainAspectRatio:false,animation:reduce?false:{duration:900},interaction:{mode:"index",intersect:false},
      plugins:{legend:{display:false},tooltip:{backgroundColor:"rgba(8,12,24,.95)",borderColor:"rgba(34,211,238,.5)",borderWidth:1,titleColor:"#9fb0cc",bodyColor:"#e6edf7"}},
      scales:{x:{ticks:{color:"#7d8aa5",maxTicksLimit:6},grid:{color:"rgba(255,255,255,.05)"}},y:{ticks:{color:"#7d8aa5"},grid:{color:"rgba(255,255,255,.05)"}}}}}));
}
function ticker(){
  const items=D.sectors.flatMap(s=>s.stocks).filter(s=>D.quotes[s.s]).map(s=>{const q=D.quotes[s.s],u=q.change>=0;
    return `<span>${s.s} ${esc(s.n)} <b class="${u?"up":"down"}">${fmt(q.price)} ${u?"▲":"▼"}${fmt(Math.abs(q.pct))}%</b></span>`}).join("");
  $("#track").innerHTML=items+items;
}
function render(anim){
  charts.forEach(c=>c.destroy());charts=[];clearInterval(typer);
  const tabs=$("#tabs");
  tabs.innerHTML=D.sectors.map((s,i)=>`<button class="tab" aria-pressed="${i==sector}" data-i="${i}">${esc(s.name)}</button>`).join("");
  tabs.querySelectorAll("button").forEach(b=>b.onclick=()=>{sector=+b.dataset.i;pick=null;render(true)});
  const g=$("#grid");g.innerHTML="";
  const list=D.sectors[sector].stocks;let latest=0;
  list.forEach((st,i)=>{
    const q=D.quotes[st.s],f=D.fundamentals?.[st.s]||{};
    const b=document.createElement("button");b.className="card"+(pick==st.s?" on":"")+(anim?" rise":"");b.style.animationDelay=i*60+"ms";
    if(!q){b.innerHTML=`<div class="top"><b>${esc(st.n)}</b><span class="sym">${st.s}</span></div><p class="note">等待首次更新…</p>`;g.append(b);return}
    latest=Math.max(latest,q.updated||0);
    const u=q.change>=0,cls=u?"up":"down";
    b.innerHTML=`<div class="top"><b>${esc(st.n)}</b><span class="sym">${st.s}</span></div>
      <div class="price ${cls}">${fmt(q.price)}</div>
      <div class="chg ${cls}">${u?"▲":"▼"} ${fmt(Math.abs(q.change))}（${fmt(Math.abs(q.pct))}%）</div>
      <div class="sym">PE ${fmt(f.pe)}・殖利率 ${fmt(f.yield)}%</div>
      <div class="spark">${spark(q.series.slice(-80).map(x=>x.p),u,anim)}</div>`;
    const pe=b.querySelector(".price");
    if(anim)count(pe,q.price);
    else if(last[st.s]!=null&&last[st.s]!==q.price)pe.classList.add(q.price>last[st.s]?"fu":"fd");
    last[st.s]=q.price;
    b.onpointermove=e=>{const r=b.getBoundingClientRect();b.style.setProperty("--mx",e.clientX-r.left+"px");b.style.setProperty("--my",e.clientY-r.top+"px")};
    b.onclick=()=>{pick=st.s;render(true);$("#panel")?.scrollIntoView({behavior:reduce?"auto":"smooth",block:"nearest"})};
    g.append(b);
  });
  if(pick){
    const st=list.find(x=>x.s==pick),q=D.quotes[pick],f=D.fundamentals?.[pick]||{},a=D.analysis?.[pick];
    const p=document.createElement("section");p.id="panel";if(anim)p.className="rise";
    const u=q&&q.change>=0;
    const kv=[["本益比",fmt(f.pe)],["股價淨值比",fmt(f.pb)],["殖利率",f.yield==null?"–":fmt(f.yield)+"%"],["市值（TWD）",big(f.mcap)],["今日最高",fmt(q?.hi)],["今日最低",fmt(q?.lo)]]
      .map(([k,v])=>`<div><span>${k}</span><b>${v}</b></div>`).join("");
    const news=(f.news||[]).map(n=>`<li><a href="${esc(n.url)}" target="_blank" rel="noopener noreferrer">${esc(n.title)}</a><br><small>${esc(n.src)}${n.t?"・"+new Date(n.t).toLocaleDateString("zh-TW"):""}</small></li>`).join("")||"<li>暫無新聞資料</li>";
    p.innerHTML=`<div class="ph"><div><div class="sym">${st.s}</div><h2>${esc(st.n)}</h2></div>
      ${q?`<div><span class="price ${u?"up":"down"}">${fmt(q.price)}</span> <span class="chg ${u?"up":"down"}">${u?"▲":"▼"} ${fmt(Math.abs(q.pct))}%</span></div>`:""}</div>
      <div class="chartbox"></div><div class="kv">${kv}</div>
      <h3>AI ANALYSIS</h3><div class="ai"></div>
      <h3>NEWS FEED</h3><ul class="news">${news}</ul>
      <p class="note">${a?"分析更新於 "+new Date(a.updated).toLocaleString("zh-TW")+"。":""}AI 生成內容僅供參考，不構成投資建議。</p>`;
    g.append(p);
    if(q)bigChart(p.querySelector(".chartbox"),q.series,u);
    const ai=p.querySelector(".ai"),txt=a?a.text:"今日分析尚未產生，將於下個交易日早上 8:30 更新。";
    if(anim&&!reduce){let i=0;ai.classList.add("caret");typer=setInterval(()=>{ai.textContent=txt.slice(0,++i);if(i>=txt.length){clearInterval(typer);ai.classList.remove("caret")}},14)}
    else ai.textContent=txt;
  }
  $("#stamp").textContent=latest?"最後更新 "+new Date(latest).toLocaleTimeString("zh-TW",{hour12:false})+"・資料可能延遲數分鐘":"";
}
load(true);setInterval(()=>load(false),60000);
</script>
</body>
</html>
